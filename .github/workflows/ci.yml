name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # For tests/test_js_parity.py (Node 22 loads the ES module in www/).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tests/js/*.test.mjs"
      - name: Syntax check of the frontend modules
        run: for f in custom_components/calendar_reminders/www/*.js; do node --experimental-detect-module --check "$f"; done
